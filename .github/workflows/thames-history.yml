name: thames-history
on:
  workflow_dispatch:
    inputs:
      job: {type: choice, options: [pull-alerts, rain-backfill], default: pull-alerts}
      month: {description: "rain-backfill only: YYYY-MM", type: string}
# One lane per job, not one per workflow: GitHub cancels a pending run when another queues in the same
# group, which is how radar back-fill batches were silently dropped. A long rainfall back-fill must never
# cancel a quick alerts pull, and neither must wait behind the collector, radar or classify.
permissions: {contents: write}
jobs:
  pull-alerts:
    if: ${{ inputs.job == 'pull-alerts' }}
    concurrency: {group: thames-alerts, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      # The Thames open data API needs no credentials (verified 19 Sep 2026); the cloudhub host and the
      # client_id/client_secret headers in 01_SPEC.md §2.6 are gone.
      - run: python scripts/thames_history.py pull --from 2022-04-01
      - name: commit if changed
        run: |
          git config user.name "swt-bot"
          git config user.email "swt-bot@users.noreply.github.com"
          git add data/thames_history
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "thames: alerts pulled $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 10; done
  rain-backfill:
    if: ${{ inputs.job == 'rain-backfill' }}
    # One lane per month, so three months can back-fill at once (spec 2.2, amended 20 Sep 2026).
    concurrency: {group: rain-backfill-${{ github.event.inputs.month }}, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: historic rainfall for one month
        env:
          MONTH: ${{ inputs.month }}
        run: |
          set -euo pipefail
          [ -n "${MONTH:-}" ] || { echo "month is required (YYYY-MM)"; exit 1; }
          START="$MONTH-01"
          END=$(python -c "import datetime;d=datetime.date.fromisoformat('$START');print(datetime.date(d.year + d.month // 12, d.month % 12 + 1, 1))")
          python scripts/rain.py --range "$START" "$END"
      - name: commit if changed
        run: |
          git config user.name "swt-bot"
          git config user.email "swt-bot@users.noreply.github.com"
          git add data/rain
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "rain: historic ${{ inputs.month }}"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 10; done
