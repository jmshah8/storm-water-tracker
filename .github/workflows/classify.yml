name: classify
on:
  schedule: [{cron: "15 * * * *"}]
  workflow_run:
    workflows: [rain]
    types: [completed]
  workflow_dispatch:
concurrency: {group: data-writers, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/classify.py
      - name: commit if changed
        run: |
          git config user.name "swt-bot"
          git config user.email "swt-bot@users.noreply.github.com"
          git add data/classification
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "classify: $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
